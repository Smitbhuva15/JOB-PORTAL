apiVersion: apps/v1
kind: Deployment

metadata:
  name: joblinker-backend
  labels:
    app: joblinker-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: joblinker-backend

  template:
    metadata:
      labels:
        app: joblinker-backend

    spec:
      containers:
        - name: backend

          image: Smitbhuva15/joblinker-backend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          envFrom:
            - secretRef:
                name: backend-secret

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"
